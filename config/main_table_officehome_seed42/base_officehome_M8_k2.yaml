# Base model cho main table OfficeHome — cùng recipe với base PACS aaedd1da4d (M=8, k=2).
# Script run_full_officehome.sh copy file này thành runs/_base_models/officehome_M8_k2_seed42/learn.yaml
# rồi gọi learn.py, để run_moe_pipeline.py --stage unlearn tìm thấy learn.yaml cạnh checkpoint.
seed: 42
dataset: officehome
data_dir: ./dataset/data_folder/officehome
unlearn_setting: random
forget_ratio: 0.1
model_name: module_small_patch16_224
pretrained: true
moe_layers: FFFFFFFFFFSS
num_experts: 8
gate_k: 2
expert_depth: 2
expert_hidden_ratio: 2
epochs: 100
batch_size: 128
lr: 0.0005
weight_decay: 0.05
lambda_sparse: 0.5
lambda_balance: 0.5
lambda_div: 0.5
ema_alpha: 0.9
domain_mass_log_every: 5
router_match_log_every: 10
wandb_mode: online
wandb_group: MainTable_OfficeHome_seed42
output_dir: runs/_base_models/officehome_M8_k2_seed42/checkpoints
