# Sequential domain removal on PACS -- ModULE. one domain per request, 3 requests: 3 sketch (the main-table target) ->
# 1 cartoon -> 0 art_painting, leaving 2 photo.
# (PACS domains: 0 art_painting 1 cartoon 2 photo 3 sketch)
# base + hyper-params = the main-table ModULE run (M=12, k=4, beta=gamma=eta=0.25, lambda 0.1/0.25/0.1);
# SalUn / Boundary Shrink keep the main-table M=8/k=2 base, as in Table 1.
# fa_threshold: -1 disables early stopping (every stage runs the full 20 epochs).
#   python sequential_unlearn.py --config config/sequential/pacs_module_seq_domain.yaml --retrain
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
model_name: module_small_patch16_224
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
unlearn_algo: module
unlearn_setting: domain
epochs: 20
batch_size: 128
lr: 0.0001
weight_decay: 0.0
fa_threshold: -1
k_u: 4
selection_option: diff
update_scope: selected_experts_and_head
alpha: 1.0
beta: 0.25
gamma: 0.25
eta: 0.25
lambda_sparse: 0.1
lambda_balance: 0.25
lambda_div: 0.1
run_eq7_diagnostics: false
pretrained_model_path: runs/_base_models/pacs_M12_k4_seed42/checkpoints/pacs_module_base_M12_k4_best.pt
study_name: ModULE__PACS__seqdomain__pacs_module_seq_domain__seed42
wandb_group: Sequential_PACS_domain_seed42
wandb_tags: [sequential, PACS, domain, ModULE, seed42]
baseline_name: ModULE
scenario: domain
sequential:
  stages:
  - [3]
  - [1]
  - [0]
  forget_mode: new
  output_root: runs/sequential/pacs_module_seq_domain
  retrain_config: config/main_table_pacs_seed42/retrain_pacs_domain.yaml
  retrain_output_root: runs/sequential/pacs_retrain_domain
