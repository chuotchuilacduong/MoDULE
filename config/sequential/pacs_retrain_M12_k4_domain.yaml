# Retrain-from-scratch reference for the sequential domain removal experiments, matching the
# M=12/k=4 base (config/experiments/pacs_module_base_M12_k4.yaml: same recipe incl. grad clipping
# + cosine LR that the base needed to stay stable). forget_domains is overwritten per stage by
# sequential_unlearn.py with the cumulative forget set; the file is only a template.
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
model_name: module_small_patch16_224
pretrained: true
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
epochs: 50
batch_size: 128
lr: 0.0005
weight_decay: 0.05
grad_clip_norm: 1.0
lr_schedule: cosine
warmup_epochs: 2
lambda_sparse: 0.5
lambda_balance: 2.0
lambda_div: 2.0
ema_alpha: 0.9
unlearn_setting: domain
forget_domains: [3]
output_root: runs/sequential/pacs_retrain_domain
k_u: 4
baseline_name: Retraining
dataset_name: PACS
scenario: domain
learn_eval_every: 0   # only the final FA/RA/TA/MIA are needed for the gap
wandb_tags: [sequential, PACS, domain, Retraining, seed42, M12_k4]
