# Sequential domain removal on PACS -- SCRUB. one domain per request, 3 requests: 3 sketch (the main-table target) ->
# 1 cartoon -> 0 art_painting, leaving 2 photo.
# base = pacs_M12_k4_seed42 (M=12, k=4): the same Original model as the ModULE chain; Retrain M=12/k=4.
# (PACS domains: 0 art_painting 1 cartoon 2 photo 3 sketch)
# fa_threshold: -1 disables early stopping (every stage runs the full 20 epochs).
#   python sequential_unlearn.py --config config/sequential/pacs_salun_seq_domain.yaml --retrain
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
model_name: module_small_patch16_224
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
unlearn_algo: scrub
unlearn_setting: domain
epochs: 20
batch_size: 128
lr: 0.0001
weight_decay: 0.0
fa_threshold: -1
alpha: 0.1
pretrained_model_path: runs/_base_models/pacs_M12_k4_seed42/checkpoints/pacs_module_base_M12_k4_best.pt
study_name: SCRUB__PACS__seqdomain__pacs_scrub_seq_domain_M12__seed42
wandb_group: Sequential_PACS_domain_seed42
wandb_tags: [sequential, PACS, domain, SCRUB, seed42, M12_k4]
baseline_name: SCRUB
scenario: domain
sequential:
  stages:
  - [3]
  - [1]
  - [0]
  forget_mode: new
  output_root: runs/sequential/pacs_scrub_seq_domain_M12
  retrain_config: config/sequential/pacs_retrain_M12_k4_domain.yaml
  retrain_output_root: runs/sequential/pacs_retrain_M12_domain
