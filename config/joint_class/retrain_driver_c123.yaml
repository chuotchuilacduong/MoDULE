# Driver used ONLY with `sequential_unlearn.py --retrain-only`: it trains the three Retrain
# references for the joint requests {0}, {0,1}, {0,1,2} (cumulative stages 1..3), each from
# ImageNet init on its own retain set, into runs/sequential/pacs_retrain_class/retrain_class_*.
# The unlearning part of this config is never executed in that mode.
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
model_name: module_small_patch16_224
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
unlearn_algo: module
unlearn_setting: class
epochs: 20
batch_size: 128
lr: 0.0001
weight_decay: 0.0
fa_threshold: -1
log_eval_every_steps: 0
k_u: 4
selection_option: diff
update_scope: selected_experts_and_head
alpha: 1.0
beta: 0.25
gamma: 0.25
eta: 0.25
lambda_sparse: 0.1
lambda_balance: 0.25
lambda_div: 0.1
run_eq7_diagnostics: false
router_match_log_every: 5
pretrained_model_path: runs/_base_models/pacs_M12_k4_seed42/checkpoints/pacs_module_base_M12_k4_best.pt
study_name: JointRetrainDriver__PACS__class__seed42
wandb_group: Sequential_PACS_class_seed42
wandb_tags: [sequential, PACS, class, ModULE, seed42]
baseline_name: ModULE
scenario: class
sequential:
  stages:
  - [0]
  - [1]
  - [2]
  forget_mode: new
  output_root: runs/joint_class/_retrain_driver
  retrain_config: config/sequential/pacs_retrain_M12_k4_class.yaml
  retrain_output_root: runs/sequential/pacs_retrain_class
