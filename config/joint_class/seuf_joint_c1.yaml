# Joint (non-sequential) class unlearning on PACS -- seuf, forget classes [0].
# Every request starts INDEPENDENTLY from the original base checkpoint; identical
# hyper-parameters to the reused 1-class run (config from runs/sequential/pacs_seuf_seq_class/configs/stage_1.yaml).
# k_u stays 4 for every request: experts are selected from the UNION of the forget classes.
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
model_name: module_small_patch16_224
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
unlearn_algo: seuf
unlearn_setting: class
epochs: 20
batch_size: 128
lr: 0.0001
weight_decay: 0.0
fa_threshold: -1
log_eval_every_steps: 0
seuf_M: 1
seuf_scope: same_layer
seuf_alpha: 1.0
seuf_lambda: 1.0
seuf_forget_loss: ga
seuf_calibration_batches: null
seuf_include_router: true
seuf_include_head: true
pretrained_model_path: runs/_base_models/pacs_M12_k4_seed42/checkpoints/pacs_module_base_M12_k4_best.pt
study_name: SEUF__PACS__jointclass__c1__seed42
wandb_group: JointClass_PACS_seed42
wandb_tags: [joint_class, PACS, class, SEUF, seed42, c1]
baseline_name: SEUF
scenario: class
forget_classes: [0]
prev_forget_classes: []
output_dir: runs/joint_class/seuf_joint_c1/checkpoints
config_path: config/joint_class/seuf_joint_c1.yaml
