name: pacs_scada_class_baseline
output_root: runs

# ---------------------------------------------------------------------------
# LEARN phase -- identical to config/learn/pacs_module.yaml so SCADA is
# compared apples-to-apples against `Module` / other baselines on the same
# pretrained base.
# ---------------------------------------------------------------------------
learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- SCADA / MiniMax (D-Arnav/SCADA, CVPR 2026), class-forgetting
# only (the adversarial synthetic sample is optimized per target class -- see
# approx_algo/scada_minimax.py). forget_classes: [0] matches
# pacs_module_class_unlearn*.yaml's convention.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: scada
  unlearn_setting: class
  forget_classes: [0]

  # unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
  # beta/gamma/eta/...) unless `study_name` is set -- SCADA doesn't have
  # those fields, so this is required to avoid an AttributeError before
  # dispatch.
  study_name: pacs_scada_class
  epochs: 20
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.1

  # ---- SCADA-specific knobs (see approx_algo/scada_minimax.py) ----
  #
  # Weight of the adversarial mislabeling loss vs. the real-data retain loss.
  m_alpha: 10.0
  # Number of synthetic images optimized per forget class.
  m_samples: 4
  # Refresh (vs. full re-init) the synthetic sample every N steps.
  m_update: 1
  # Pseudo-label construction for the mislabeling step: rescaled | uniform | random.
  m_label: rescaled
  # Steps per epoch; defaults to len(retain_loader) if omitted.
  iter_per_epoch: null

  wandb_mode: disabled

# ---------------------------------------------------------------------------
# Sweep grid (Cartesian). Remove for a single run.
# ---------------------------------------------------------------------------
sweep:
  parameters:
    unlearn.m_alpha: [1.0, 10.0, 50.0]
    unlearn.m_label: [rescaled, uniform, random]
