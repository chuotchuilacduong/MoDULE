name: pacs_salun_domain_baseline
output_root: runs

learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- SalUn, domain-forgetting setting. forget_domains: [3] =
# the 4th PACS domain in sorted order (sketch), matching
# pacs_module_domain_unlearn_sketch.yaml's convention.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: salun
  unlearn_setting: domain
  forget_domains: [3]

  study_name: pacs_salun_domain
  epochs: 20
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.1

  alpha: 0.6
  mask_ratio: 0.5

  wandb_mode: disabled
