name: pacs_seuf_domain_baseline
output_root: runs

# ---------------------------------------------------------------------------
# LEARN phase -- identical to config/learn/pacs_module.yaml so SEUF is
# compared apples-to-apples against `Module` on the same pretrained base.
# ---------------------------------------------------------------------------
learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- SEUF (Zhuang et al., ACL 2025), domain-forgetting setting.
# forget_domains: [3] = the 4th PACS domain in sorted order (sketch), matching
# config/experiments/pacs_module_domain_unlearn_sketch.yaml's convention.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: seuf
  unlearn_setting: domain
  forget_domains: [3]

  # unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
  # beta/gamma/eta/...) unless `study_name` is set -- SEUF doesn't have those
  # fields, so this is required to avoid an AttributeError before dispatch.
  study_name: pacs_seuf_domain
  epochs: 20
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.1

  # ---- SEUF-specific knobs (see approx_algo/seuf.py) ----
  seuf_M: 1
  seuf_scope: same_layer
  seuf_alpha: 1.0
  seuf_lambda: 1.0
  seuf_forget_loss: ga
  seuf_calibration_batches: null
  seuf_include_router: true
  seuf_include_head: false

  wandb_mode: disabled
