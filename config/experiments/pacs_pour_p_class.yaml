name: pacs_pour_p_class_baseline
output_root: runs

# ---------------------------------------------------------------------------
# LEARN phase -- identical to config/learn/pacs_module.yaml so POUR-P is
# compared apples-to-apples against `Module` / other baselines on the same
# pretrained base.
# ---------------------------------------------------------------------------
learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- POUR-P (ale256/representation_unlearning, CVPR 2026):
# closed-form, single-shot projection, no training loop. Only meaningful for
# class-forgetting (see approx_algo/pour.py) -- forget_classes: [0] matches
# pacs_module_class_unlearn*.yaml's convention.
#
# `_find_classifier_head` picks up ModuleArchitecture's `classifier_head`
# (an nn.Linear over the pooled ViT features) directly, so this needs no
# architecture-specific handling -- unlike POUR's original resnet50/CIFAR-100
# example, PACS only has 7 classes, so the "neural collapse simplex ETF"
# geometry the paper's projection assumes is a much lower-dimensional (and
# more approximate) structure here; the projection math itself is unaffected.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: pour_p
  unlearn_setting: class
  forget_classes: [0]

  # unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
  # beta/gamma/eta/...) unless `study_name` is set -- POUR-P doesn't have
  # those fields, so this is required to avoid an AttributeError before
  # dispatch.
  study_name: pacs_pour_p_class

  # unused by POUR_P (no gradient steps, no early stop) but required by the
  # shared config schema.
  epochs: 1
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.1

  wandb_mode: disabled
