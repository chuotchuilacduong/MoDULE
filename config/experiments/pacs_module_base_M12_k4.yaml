seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
unlearn_setting: random
forget_ratio: 0.1
model_name: module_small_patch16_224
pretrained: true
moe_layers: FFFFFFFFFFSS
num_experts: 12
gate_k: 4
expert_depth: 2
expert_hidden_ratio: 2
epochs: 100
batch_size: 128
lr: 0.0005
weight_decay: 0.05
# the seed-42 run of this config diverged at epoch ~57 (train CE 0.056 -> 1.81)
# under a constant LR with no clipping; the epoch-100 checkpoint scored TA 80.68%
# vs 91.99% for the pre-divergence epoch-55 one. any rerun should use these.
grad_clip_norm: 1.0
lr_schedule: cosine
warmup_epochs: 2
lambda_sparse: 0.5
lambda_balance: 2.0
lambda_div: 2.0
ema_alpha: 0.9
output_dir: runs/_base_models/pacs_M12_k4_seed42/checkpoints
