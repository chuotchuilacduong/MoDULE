# SPM baseline -- random 10% unlearning on PACS.
#
# SPM is NOT a module_* MoE architecture, so -- unlike the SEUF/GRIP/RepSelect
# baselines -- it cannot go through config/learn/run_moe_pipeline.py (that
# runner hard-requires learn.model_name to start with "module_"). Run this
# directly, after training the base checkpoint with config/learn/pacs_spm.yaml:
#
#   python learn.py --config config/learn/pacs_spm.yaml
#   python unlearn.py --config config/experiments/pacs_spm_unlearn.yaml
#
# The learn step above writes its final checkpoint to
# checkpoint/config/learn/pacs_spm/pacs_spm.pt (derived from the config path
# by learn.py's own rel_structure logic) -- pretrained_model_path below
# matches that. If you rename/move the learn config, update this path too.

seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs

model_name: spm_resnet18
pretrained_model_path: checkpoint/config/learn/pacs_spm/pacs_spm.pt
num_experts: 4                    # must match config/learn/pacs_spm.yaml (SPM head shape)

unlearn_setting: random
forget_ratio: 0.1

unlearn_algo: spm
support_size: 512                 # size of the memory bank rebuilt at unlearn time

# unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
# beta/gamma/eta/...) unless `study_name` is set -- SPM doesn't have those
# fields, so this is required to avoid an AttributeError before dispatch.
study_name: pacs_spm_random10

# unused by SPM_Unlearn (no gradient steps, no early stop) but required by
# the shared config schema: unlearn.py unconditionally builds an AdamW
# optimizer and reads fa_threshold/batch_size before dispatch.
epochs: 1
batch_size: 64
lr: 0.001
fa_threshold: 0.8

wandb_mode: disabled
