name: pacs_seuf_baseline
output_root: runs

# ---------------------------------------------------------------------------
# LEARN phase -- identical to the standard MoDULE learn config (config/learn/
# pacs_module.yaml) so SEUF is compared apples-to-apples against `Module` on
# the same pretrained base. run_moe_pipeline.py caches the base checkpoint by
# the full learn config, so this reuses the base_models entry.
# ---------------------------------------------------------------------------
learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- SEUF (Zhuang et al., ACL 2025) as a baseline.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: seuf
  # unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
  # beta/gamma/eta/...) unless `study_name` is set -- SEUF doesn't have those
  # fields, so this is required to avoid an AttributeError before dispatch.
  # unlearn.py uses this string verbatim (no templating); sweep trials share
  # it as a label, but full per-trial hyperparams are still logged via
  # wandb's `config=yaml_config`, so runs remain distinguishable/filterable.
  study_name: pacs_seuf
  epochs: 20
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.1

  # ---- SEUF-specific knobs (see approx_algo/seuf.py) ----
  #
  # M = number of target experts per layer. The paper (Insight 4, Table 2)
  # finds M=1 optimal. Set >1 only to reproduce their ablations.
  seuf_M: 1

  # Selection scope. "same_layer" gives every MoE layer M target experts;
  # "cross_layer" picks the global top-M (layer, expert) pairs, so some
  # layers may get zero and stay fully frozen. Paper: same_layer > cross.
  seuf_scope: same_layer

  # Anchor loss weight (paper Eq. 4, alpha; paper Table 6: alpha=1 optimal).
  seuf_alpha: 1.0

  # Retain loss weight (paper Eq. 4, lambda).
  seuf_lambda: 1.0

  # Base unlearning algorithm. Paper tests {ga, gdiff, npo, rmu}; here we
  # support {ga, gdiff} since npo/rmu aren't wired into this repo.
  seuf_forget_loss: ga

  # Cap the calibration pass. null = use the whole forget loader (safe on
  # PACS; on larger datasets cap at e.g. 32 batches for speed).
  seuf_calibration_batches: null

  # Structural knobs. The paper unfreezes both the target expert and its
  # router. `seuf_include_head` is off by default (matches paper).
  seuf_include_router: true
  seuf_include_head: false

  wandb_mode: disabled

# ---------------------------------------------------------------------------
# Sweep grid (Cartesian). Remove for a single run.
# Reproduces the paper's key ablations: single- vs multi-expert unlearning
# (Table 2/7), anchor-loss weight sensitivity (Table 6), base-algorithm
# agnosticism (Sec. 4).
# ---------------------------------------------------------------------------
sweep:
  parameters:
    unlearn.seuf_M: [1, 3, 6]
    unlearn.seuf_alpha: [0, 1.0, 100.0]
    unlearn.seuf_forget_loss: [ga, gdiff]
