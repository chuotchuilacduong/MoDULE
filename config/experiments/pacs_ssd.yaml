name: pacs_ssd_baseline
output_root: runs

# ---------------------------------------------------------------------------
# LEARN phase -- identical to config/learn/pacs_module.yaml so SSD is
# compared apples-to-apples against `Module` / other baselines on the same
# pretrained base.
# ---------------------------------------------------------------------------
learn:
  seed: 42
  dataset: pacs
  data_dir: ./dataset/data_folder/pacs
  unlearn_setting: random
  forget_ratio: 0.1
  model_name: module_small_patch16_224
  pretrained: true
  moe_layers: FFFFFFFFFFSS
  num_experts: 8
  gate_k: 2
  expert_depth: 2
  expert_hidden_ratio: 2
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.05
  lambda_sparse: 0.5
  lambda_balance: 0.5
  lambda_div: 0.5
  ema_alpha: 0.9
  wandb_mode: disabled

# ---------------------------------------------------------------------------
# UNLEARN phase -- SSD / Selective Synaptic Dampening (if-loops/selective-
# synaptic-dampening), random-forgetting setting. No gradient-descent loop --
# a single Fisher-importance-based weight edit. Not restricted to any
# unlearn_setting -- works with random/class/domain alike, see
# approx_algo/ssd.py.
# ---------------------------------------------------------------------------
unlearn:
  unlearn_algo: ssd

  # unlearn.py falls back to a Module-specific run-name template (k_u/alpha/
  # beta/gamma/eta/...) unless `study_name` is set -- SSD doesn't have those
  # fields, so this is required to avoid an AttributeError before dispatch.
  study_name: pacs_ssd_random

  # unused by SSD (no gradient steps, no early stop) but required by the
  # shared config schema.
  epochs: 1
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0
  fa_threshold: 0.8

  # ---- SSD-specific knobs (see approx_algo/ssd.py) ----
  #
  # alpha in the paper: how many times more forget-important than
  # overall-important a weight must be before it gets dampened.
  selection_weighting: 10.0
  # lambda in the paper: dampening strength for selected weights.
  dampening_constant: 1.0
  # cap so weights only ever shrink, never grow.
  ssd_lower_bound: 1.0
  ssd_exponent: 1.0

  wandb_mode: disabled

# ---------------------------------------------------------------------------
# Sweep grid (Cartesian). Remove for a single run.
# ---------------------------------------------------------------------------
sweep:
  parameters:
    unlearn.selection_weighting: [1.0, 10.0, 50.0]
