# Base-learn nhanh để kiểm chứng bản vá L_bal (trục expert + hệ số M, paper Eq.4/34).
# Giống hệt learn.yaml của base aaedd1da4d, chỉ rút epoch 100 -> 30 và log domain-mass
# dày hơn. L_sp và L_div GIỮ NGUYÊN (vẫn lệch paper) để cô lập tác dụng của riêng L_bal.
seed: 42
dataset: pacs
data_dir: ./dataset/data_folder/pacs
unlearn_setting: random
forget_ratio: 0.1
model_name: module_small_patch16_224
pretrained: true
moe_layers: FFFFFFFFFFSS
num_experts: 8
gate_k: 2
expert_depth: 2
expert_hidden_ratio: 2
epochs: 100
batch_size: 128
lr: 0.0005
weight_decay: 0.05
lambda_sparse: 0.5
lambda_balance: 0.5
lambda_div: 0.5
ema_alpha: 0.9
domain_mass_log_every: 5
router_match_log_every: 10
wandb_mode: online
output_dir: runs/_base_models/base_balfix_M8_k2_100ep/checkpoints
